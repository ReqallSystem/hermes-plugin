name: reqall
version: 2026.9.7
description: >
  Reqall project memory for Hermes — turn-start recall, agreed intent,
  inline record links, verified persistence acknowledgement, and SLEEP.
author: ReqallSystem
manifest_version: 1
homepage: https://github.com/ReqallSystem/hermes-plugin
tags: [memory, reqall, mcp]
requires_env:
  - name: REQALL_API_KEY
    description: Reqall API key for typed hook recall and verified record/link readbacks (MCP aliases also accepted)
    url: https://www.reqall.net
    secret: true
config_schema:
  project_name:
    type: str
    description: Explicit project override. REQALL_PROJECT_NAME overrides this setting.
  machine_name:
    type: str
    description: Stable machine hostname for reserved project fallback; REQALL_MACHINE_NAME overrides.
  api_url:
    type: str
    default: https://www.reqall.net
    description: Reqall base origin without /mcp; REQALL_URL overrides.
  doc_interval_min:
    type: number
    default: 10
    description: Minimum minutes between documentation nudges; zero disables throttling.
  persist_interval_min:
    type: number
    default: 30
    description: Minimum minutes between turn-start dirty-work reminders; edited-code gate is per turn.
provides_tools:
  - reqall
  - reqall_status
  - reqall_skill
  - reqall_session
provides_hooks:
  - on_session_start
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - pre_verify
  - on_session_end
  - on_session_finalize
provides_commands:
  - reqall
provides_skills:
  - reqall-context
  - reqall-intend
  - reqall-persist
  - reqall-document
  - reqall-triage
  - reqall-review
  - reqall-sleep
